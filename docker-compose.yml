services:
  harvey:
    build: .
    command:
      - /bin/sh
      - -c
      - |
        test -f /app/data/harvey.local.yaml ||
          cp /app/harvey.yaml /app/data/harvey.local.yaml
        ln -sf /app/data/harvey.local.yaml /app/harvey.local.yaml
        exec python -m harvey.main
    env_file: .env
    volumes:
      # Named volumes survive Dokploy replacing its deployment checkout.
      - harvey-data:/app/data
      # Mount config for easy editing without rebuild
      - ./harvey.yaml:/app/harvey.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
      # Mount Claude auth (required for Max plan usage).
      # Not read-only: the CLI refreshes OAuth tokens in place.
      # The container runs as non-root user "harvey" (uid 1000).
      - ~/.claude:/home/harvey/.claude
      # Codex login survives rebuilds and redeploys. Harvey reads this login
      # but runs every model call from a separate, throwaway CODEX_HOME.
      - codex-auth:/home/harvey/.codex
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Opt-in remote dashboard for a named Cloudflare Tunnel. Enable all three
  # services with COMPOSE_PROFILES=cloudflare. The dashboard itself still
  # listens only on loopback; Caddy is the narrow adapter that rewrites the
  # proxy request to the loopback Host/Origin Harvey requires.
  dashboard:
    profiles: [cloudflare]
    build: .
    command:
      - /bin/sh
      - -c
      - |
        test -f /app/data/harvey.local.yaml ||
          cp /app/harvey.yaml /app/data/harvey.local.yaml
        ln -sf /app/data/harvey.local.yaml /app/harvey.local.yaml
        exec python -m harvey.cli dashboard --host 127.0.0.1 --port 5555
    env_file: .env
    volumes:
      - harvey-data:/app/data
      - ./harvey.yaml:/app/harvey.yaml:ro
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills
    restart: unless-stopped
    init: true

  dashboard-proxy:
    profiles: [cloudflare]
    image: caddy:2.10-alpine
    network_mode: "service:dashboard"
    command:
      - caddy
      - reverse-proxy
      - --from
      - :8080
      - --to
      - 127.0.0.1:5555
      - --header-up
      - "Host: 127.0.0.1:5555"
      - --header-up
      - "Origin: http://127.0.0.1:5555"
    depends_on:
      - dashboard
    restart: unless-stopped

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:latest
    network_mode: "service:dashboard"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - dashboard
      - dashboard-proxy
    restart: unless-stopped

volumes:
  harvey-data:
  codex-auth:
